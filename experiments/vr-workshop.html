<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPTeamup · VR Workshop</title>
<style>body{margin:0;background:#060b17;color:#e5f7ff;font-family:system-ui}#help{position:fixed;top:14px;left:14px;z-index:5;background:#071627db;border:1px solid #4a8295;border-radius:14px;padding:12px 16px;max-width:340px;font-size:14px;line-height:1.5;pointer-events:none}#help a{color:#96f4e6;pointer-events:auto}#help b{letter-spacing:.08em}#status{position:fixed;bottom:18px;left:18px;z-index:5;background:#071627c9;padding:8px 13px;border-radius:9px;font-size:13px;pointer-events:none}button{cursor:pointer}@media(max-width:600px){#help{font-size:12px;max-width:260px}#status{font-size:11px}}</style>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<script>
AFRAME.registerComponent('station', {
 schema:{action:{type:'string'},label:{type:'string'}},
 init:function(){this.el.addEventListener('click',()=>{const a=this.data.action;let msg='';if(a==='pulse'){document.querySelectorAll('.pulse').forEach((el,i)=>{el.setAttribute('animation__jump',{property:'position',to:(i%2?'-1.2':'1.2')+' '+(1.3+i*.3)+' -4',dur:650,dir:'alternate',loop:2,easing:'easeInOutSine'});el.setAttribute('animation__spin',{property:'rotation',to:'0 720 0',dur:1600,easing:'easeInOutCubic'})});msg='Pulse sent through the sculptures.'}if(a==='color'){const colors=['#61ffcb','#ffad6b','#a987ff','#68bbff','#ff6eac'];document.querySelectorAll('.sculpt').forEach((el,i)=>el.setAttribute('color',colors[(i+Math.floor(Math.random()*colors.length))%colors.length]));msg='Sculptures recolored.'}if(a==='spawn'){const group=document.querySelector('#orb-cloud');for(let i=0;i<6;i++){const orb=document.createElement('a-sphere');const x=(Math.random()-.5)*6,y=1+Math.random()*3,z=-5-Math.random()*3;orb.setAttribute('position',x+' '+y+' '+z);orb.setAttribute('radius',.08+Math.random()*.18);orb.setAttribute('color',['#61ffcb','#ffae6a','#8eaaff'][i%3]);orb.setAttribute('material','emissive:'+['#1a4e46','#4b281c','#232c55'][i%3]+';metalness:.2;roughness:.25');orb.setAttribute('animation',{property:'position',to:x+' '+(y+.6)+' '+z,dur:1500+Math.random()*1200,dir:'alternate',loop:true,easing:'easeInOutSine'});group.appendChild(orb)}msg='New floating lights created.'}if(a==='reset'){document.querySelectorAll('#orb-cloud > *').forEach(el=>el.remove());document.querySelectorAll('.sculpt').forEach(el=>el.setAttribute('color','#61ffcb'));document.querySelector('#rig').setAttribute('position','0 0 0');msg='Workshop reset.'}if(a==='deck'){document.querySelector('#rig').setAttribute('position','0 0 -7');msg='Teleported to observation deck.'}if(a==='home'){document.querySelector('#rig').setAttribute('position','0 0 0');msg='Returned to the hub.'}document.querySelector('#status').textContent=msg;});
 this.el.addEventListener('mouseenter',()=>this.el.setAttribute('scale','1.07 1.07 1.07'));
 this.el.addEventListener('mouseleave',()=>this.el.setAttribute('scale','1 1 1'));
}});
</script></head><body>
<div id="help"><b>GPTEAMUP · VR WORKSHOP</b><br>Point and trigger a glowing panel with your Quest controller. Look around and explore. In the regular browser, click panels with your pointer.<br><a href="../index.html">← Experiment index</a><br><small>Press <b>Enter VR</b> at bottom right for immersive mode.</small></div><div id="status" role="status">Ready · Touch the workshop controls.</div>
<a-scene background="color:#07101e" renderer="antialias:true; colorManagement:true" vr-mode-ui="enabled:true" xr-mode-ui="enabled:true;XRMode:xr" loading-screen="dotsColor:#61ffcb;backgroundColor:#07101e">
<a-assets></a-assets>
<a-entity light="type:ambient;intensity:.6;color:#8cb7dc"></a-entity>
<a-entity light="type:directional;intensity:1.1;color:#b4fff0" position="-3 7 2"></a-entity>
<a-entity light="type:point;intensity:1.6;color:#5ccfe8;distance:18" position="0 3 -4"></a-entity>
<a-sky color="#06101e"></a-sky>
<a-plane rotation="-90 0 0" position="0 -0.04 -3" width="40" height="40" color="#0e1d2d" material="roughness:.85"></a-plane>
<a-entity position="0 0 -3">
<a-torus position="0 .01 0" rotation="-90 0 0" radius="4" radius-tubular=".018" color="#288b9a"></a-torus>
<a-torus position="0 .02 0" rotation="-90 0 0" radius="2.7" radius-tubular=".012" color="#24556b"></a-torus>
</a-entity>
<a-entity id="rig" position="0 0 0"><a-entity id="camera" camera look-controls wasd-controls="acceleration:25" position="0 1.6 0"><a-cursor raycaster="objects:.clickable;far:25" fuse="false" color="#61ffcb"></a-cursor></a-entity>
<a-entity laser-controls="hand:left" raycaster="objects:.clickable;far:25" line="color:#6cebd8;opacity:.7"></a-entity>
<a-entity laser-controls="hand:right" raycaster="objects:.clickable;far:25" line="color:#6cebd8;opacity:.7"></a-entity></a-entity>
<a-text value="THE WORKSHOP" align="center" width="8" color="#c5ffea" position="0 3.5 -5.8"></a-text>
<a-text value="A place to explore ideas in three dimensions" align="center" width="5" color="#8aadc2" position="0 3.15 -5.8"></a-text>
<a-entity id="orb-cloud"></a-entity>
<a-entity position="0 1.6 -4.4">
<a-icosahedron class="sculpt pulse" color="#61ffcb" radius=".75" material="metalness:.45;roughness:.25;emissive:#0e3430" animation="property:rotation;to:0 360 360;dur:15000;loop:true;easing:linear"></a-icosahedron>
<a-torus class="sculpt" color="#61ffcb" radius="1.25" radius-tubular=".023" rotation="55 18 20" animation="property:rotation;to:55 378 20;dur:23000;loop:true;easing:linear"></a-torus>
<a-torus class="sculpt" color="#61ffcb" radius="1.45" radius-tubular=".018" rotation="10 0 85" animation="property:rotation;to:370 0 85;dur:26000;loop:true;easing:linear"></a-torus>
</a-entity>
<a-box position="0 .5 -4.5" width="2.7" height="1" depth="2.7" color="#1d3546" material="metalness:.45"></a-box>
<a-cylinder position="0 1.04 -4.5" radius="1.15" height=".09" color="#294f5e"></a-cylinder>
<a-entity position="-3 1.8 -3.2" rotation="0 35 0">
<a-box position="0 0 -.04" width="2.3" height="2.6" depth=".1" color="#152a3b" material="metalness:.35"></a-box>
<a-text value="EXPERIMENT CONTROLS" position="0 .95 .04" width="2.5" align="center" color="#a9e3ed"></a-text>
<a-box class="clickable" station="action:pulse" position="0 .5 .08" width="1.95" height=".45" depth=".12" color="#247d79"></a-box><a-text value="PULSE" position="0 .5 .16" width="2.8" align="center"></a-text>
<a-box class="clickable" station="action:color" position="0 -.1 .08" width="1.95" height=".45" depth=".12" color="#585b9c"></a-box><a-text value="NEW COLORS" position="0 -.1 .16" width="2.8" align="center"></a-text>
<a-box class="clickable" station="action:spawn" position="0 -.7 .08" width="1.95" height=".45" depth=".12" color="#a56939"></a-box><a-text value="SPAWN LIGHTS" position="0 -.7 .16" width="2.8" align="center"></a-text>
</a-entity>
<a-entity position="3 1.8 -3.2" rotation="0 -35 0">
<a-box position="0 0 -.04" width="2.3" height="2.6" depth=".1" color="#152a3b"></a-box>
<a-text value="NAVIGATION" position="0 .95 .04" width="2.4" align="center" color="#a9e3ed"></a-text>
<a-box class="clickable" station="action:deck" position="0 .5 .08" width="1.95" height=".45" depth=".12" color="#256a9b"></a-box><a-text value="OBSERVATION DECK" position="0 .5 .16" width="2.55" align="center"></a-text>
<a-box class="clickable" station="action:home" position="0 -.1 .08" width="1.95" height=".45" depth=".12" color="#247d79"></a-box><a-text value="RETURN TO HUB" position="0 -.1 .16" width="2.65" align="center"></a-text>
<a-box class="clickable" station="action:reset" position="0 -.7 .08" width="1.95" height=".45" depth=".12" color="#894857"></a-box><a-text value="RESET SCENE" position="0 -.7 .16" width="2.7" align="center"></a-text>
</a-entity>
<a-entity position="0 0 -10">
<a-cylinder position="0 .3 0" radius="2.1" height=".6" color="#203b52"></a-cylinder>
<a-torus position="0 .66 0" rotation="-90 0 0" radius="1.65" radius-tubular=".04" color="#62cbbf"></a-torus>
<a-text value="OBSERVATION DECK" width="5" align="center" position="0 3 -1" color="#bdfbeb"></a-text>
<a-sphere position="-1.2 2.2 0" radius=".35" color="#ffae6a" animation="property:position;to:-1.2 2.7 0;dur:2500;dir:alternate;loop:true"></a-sphere>
<a-octahedron position="1.3 2.2 -.6" radius=".55" color="#7f9eff" animation="property:rotation;to:0 360 0;dur:6500;loop:true;easing:linear"></a-octahedron>
</a-entity>
<a-text value="GPTEAMUP  /  EXPERIMENT 004" width="5" align="center" color="#7099ae" position="0 .3 -2.9" rotation="-90 0 0"></a-text>
</a-scene>
</body></html>
