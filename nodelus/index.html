<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><meta name="robots" content="noindex">
<title>GPTeamup · Nodelus</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0a1015;color:#e7edf0;font:16px/1.6 system-ui,sans-serif}iframe[hidden]{display:none}iframe{display:block;width:100%;height:100%;border:0}#message{position:fixed;inset:0;display:grid;place-content:center;padding:28px;text-align:center}#message[hidden]{display:none}h1{font-size:34px;letter-spacing:-1px;margin:0 0 12px}p{color:#aab9c4;max-width:540px;margin:8px auto}a{color:#a7f0c2;text-underline-offset:4px}button{background:#a7f0c2;border:0;border-radius:7px;padding:12px 22px;font:inherit;cursor:pointer;margin:16px auto}small{color:#8296a4}button:focus-visible,a:focus-visible{outline:2px solid #ffa76b;outline-offset:5px}
</style>
</head>
<body>
<div id="message" role="status" aria-live="polite"><h1>GPTeamup</h1><p id="detail">Opening the workshop…</p><button id="retry" hidden>Try again</button><p><a href="https://github.com/nathanconnell/GPTeamup" target="_blank" rel="noopener noreferrer">View the GitHub repository ↗</a></p></div>
<iframe id="experiment" title="GPTeamup interactive experiments" sandbox="allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" hidden></iframe>
<noscript><style>#message{display:none}</style><p style="padding:30px">Enable JavaScript to open the experiment, or <a href="https://github.com/nathanconnell/GPTeamup">visit GPTeamup on GitHub</a>.</p></noscript>
<script>
'use strict';
// Upload this file to nodelus.com/gpteamup/index.html.
// The experiment lives in the repository's ROOT index.html, not this loader.
// Keep the source public. Do not put GitHub tokens in this browser file.
const source='https://raw.githubusercontent.com/nathanconnell/GPTeamup/main/index.html';
let attempt=0;
async function openWorkshop(){const current=++attempt,message=document.getElementById('message'),detail=document.getElementById('detail'),retry=document.getElementById('retry'),frame=document.getElementById('experiment');message.hidden=false;retry.hidden=true;detail.textContent='Opening the workshop…';
const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);
try{const response=await fetch(source+'?v='+Date.now(),{cache:'no-store',credentials:'omit',signal:controller.signal});if(!response.ok)throw new Error('HTTP '+response.status);const html=await response.text();if(!/<!doctype html/i.test(html)||!html.includes('GPTeamup'))throw new Error('Unexpected source file');if(current!==attempt)return;frame.onload=()=>{if(current===attempt){frame.hidden=false;message.hidden=true}};frame.srcdoc=html}
catch(error){if(current!==attempt)return;detail.textContent='The workshop could not be loaded. Check your connection and try again, or visit the repository below.';retry.hidden=false}
finally{clearTimeout(timeout)}}
document.getElementById('retry').addEventListener('click',openWorkshop);openWorkshop();
</script>
</body>
</html>
